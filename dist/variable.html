<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In-order pipeline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='none' stroke='%23233145' stroke-width='2'/%3E%3Crect x='7' y='7' width='18' height='18' rx='2' fill='%232563eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <main>
    <div class="scene" role="img" aria-label="Numbered instructions advance through IF, ID, EX, MEM, and WB.">
      <div id="stages" aria-hidden="true"></div>
      <div id="stream" aria-hidden="true"></div>
    </div>
    <div class="controls">
      <div class="field"><label for="speed">Speed</label><input id="speed" type="range" min="0.25" max="3" step="0.05" value="1"><output id="speed-value" for="speed">1×</output></div>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="reset" type="button">Reset</button>
      <div class="field"><label for="seed">Seed</label><input id="seed" type="text" value="152" maxlength="64" spellcheck="false"><button id="apply-seed" type="button">Set seed</button></div>
    </div>
    <div class="page-picker"><label for="page">Page</label><select id="page"><option value="index.html">1 · In-order pipeline</option><option value="variable.html">2 · Variable EX / MEM</option></select></div>
  </main>
</body>
</html>
