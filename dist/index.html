<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In-order pipeline</title>
  <meta name="description" content="Numbered instructions hop through five pipeline stages in order.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='none' stroke='%23233145' stroke-width='2'/%3E%3Crect x='7' y='7' width='18' height='18' rx='2' fill='%232563eb'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; background: #fff; overflow: hidden; }
    svg { display: block; width: min(1100px, 96vw); height: auto; overflow: visible; }
    .stage { fill: none; stroke: #233145; stroke-width: 2.5; }
    .stage-label { fill: #233145; font: 600 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .instruction rect { fill: #2563eb; }
    .instruction text { fill: white; font: 600 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  </style>
</head>
<body>
  <svg viewBox="0 0 952 260" role="img" aria-label="A continuous stream of numbered instructions advances in order through five pipeline stages, one hop per clock cycle.">
    <defs><clipPath id="stream-window"><rect x="0" y="0" width="952" height="260"/></clipPath></defs>
    <g id="stages" aria-hidden="true"></g>
    <g id="stream" clip-path="url(#stream-window)" aria-hidden="true"></g>
  </svg>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const stages = document.getElementById('stages');
    const stream = document.getElementById('stream');
    const pitch = 100, size = 72, origin = 40, baseline = 94;
    const cycle = 850, hold = 590;
    const nodes = new Map();
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function element(tag, attributes) {
      const node = document.createElementNS(NS, tag);
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
      return node;
    }

    const stageNames = ['IF', 'ID', 'EX', 'MEM', 'WB'];
    for (let i = 0; i < 5; i++) {
      const label = element('text', {
        class: 'stage-label', x: origin + (i + 2) * pitch + size / 2, y: baseline - 26
      });
      label.textContent = stageNames[i];
      stages.append(label);
      stages.append(element('rect', {
        class: 'stage', x: origin + (i + 2) * pitch - 7,
        y: baseline - 7, width: size + 14, height: size + 14, rx: 4
      }));
    }

    const start = performance.now();
    function animate(now) {
      const elapsed = now - start;
      const tick = Math.floor(elapsed / cycle);
      const phase = elapsed % cycle;
      const progress = Math.max(0, (phase - hold) / (cycle - hold));
      const eased = progress * progress * (3 - 2 * progress);
      const lift = reducedMotion.matches ? 0 : Math.sin(progress * Math.PI) * 20;

      for (const [number, node] of nodes) {
        if (number < tick + 1) { node.remove(); nodes.delete(number); }
      }
      for (let number = tick + 1; number <= tick + 10; number++) {
        let node = nodes.get(number);
        if (!node) {
          node = element('g', { class: 'instruction' });
          node.append(element('rect', { width: size, height: size, rx: 3 }));
          const label = element('text', { x: size / 2, y: size / 2 });
          label.textContent = number;
          // Keep even long-running instruction numbers inside their boxes.
          if (String(number).length > 3) label.style.fontSize = `${Math.min(24, 100 / String(number).length)}px`;
          node.append(label);
          nodes.set(number, node);
          stream.append(node);
        }
        const slot = 9 - number + tick + eased;
        const movement = reducedMotion.matches ? Math.round(eased) : eased;
        const x = origin + (slot - eased + movement) * pitch;
        node.setAttribute('transform', `translate(${x} ${baseline - lift})`);
        const opacity = Math.max(0, Math.min(1, slot + 1, 9 - slot));
        node.setAttribute('opacity', opacity);
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
